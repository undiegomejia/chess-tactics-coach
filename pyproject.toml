[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "chess-tactics-coach"
version = "0.1.0"
description = "A chess tactics training application using FastAPI and Stockfish"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn",
    "sqlalchemy",
    "python-chess",
    "stockfish",
    "pydantic",
    "pydantic-settings",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx",
    "pytest-cov",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[[tool.mypy.overrides]]
module = "stockfish.*"
ignore_missing_imports = true